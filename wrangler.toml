# Cloudflare Pages
# Bindings are applied from this file on each Git deploy (dashboard may say
# "managed by wrangler" — that is expected; do not also add a duplicate R2 binding).
name = "family-command-centre"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

[ai]
binding = "AI"

# R2: bucket must already exist in the account (R2 → greenhq-messages).
# Binding name MESSAGE_IMAGES is what functions read as env.MESSAGE_IMAGES.
[[r2_buckets]]
binding = "MESSAGE_IMAGES"
bucket_name = "greenhq-messages"
