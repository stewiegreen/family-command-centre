# Cloudflare Pages + Workers AI + R2
# Dashboard: Pages → Settings → Functions → Bindings
name = "family-command-centre"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

[ai]
binding = "AI"

# Message photo uploads (must also add the binding in the Pages dashboard)
[[r2_buckets]]
binding = "MESSAGE_IMAGES"
bucket_name = "greenhq-messages"
